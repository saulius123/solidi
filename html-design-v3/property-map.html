<!doctype html>
<html lang="lt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Objekto vieta — Solidi</title><link rel="stylesheet" href="assets/leaflet.css"><style>html,body,#map{height:100%;margin:0}body{background:#eae3d8;font:13px Arial;color:#30332f}.house-marker{background:none;border:0}.house-marker svg{display:block;filter:drop-shadow(0 3px 4px #0005)}.house-marker:focus-visible{outline:3px solid #b8836c;outline-offset:4px}.leaflet-control-zoom a{color:#30332f!important;background:#f8f6f2!important}.fallback{padding:20px}.nearby-controls{display:flex;align-items:center;gap:7px;padding:10px 12px 6px;background:#f8f6f2;flex-wrap:wrap}.nearby-controls>span{font-size:11px;margin-right:4px}.nearby-controls button,#nearby-retry{font:12px Arial;color:#30332f;border:1px solid #c5c8be;background:transparent;padding:7px 10px;border-radius:3px;cursor:pointer}.nearby-controls button[aria-pressed=true]{background:#30332f;color:#f8f6f2;border-color:#30332f}.nearby-controls button:focus-visible,#nearby-retry:focus-visible{outline:2px solid #b8836c;outline-offset:2px}.nearby-status{padding:3px 12px 9px;font-size:10px;color:#676e61;background:#f8f6f2;display:flex;align-items:center;gap:10px;min-height:20px}body{display:flex;flex-direction:column}#map{height:auto;flex:1;min-height:170px}.poi-marker{border:0;background:none}.poi-marker svg{display:block;filter:drop-shadow(0 1px 2px #0005)}.leaflet-popup-content{font:12px/1.6 Arial;color:#30332f}.leaflet-popup-content a{color:#536851}.leaflet-popup-content p{margin:5px 0}#nearby-retry{font-size:10px;padding:3px 6px}[hidden]{display:none!important}@media(max-width:420px){.nearby-controls{gap:5px;padding:8px}.nearby-controls>span{display:none}.nearby-controls button{font-size:11px;padding:7px 8px}.nearby-status{padding-left:8px}} </style><script src="assets/leaflet.js" defer></script><script src="assets/property-map.js" defer></script></head><body><div class="nearby-controls" aria-label="Vietos netoliese"><span>Netoliese:</span><button type="button" data-category="schools" aria-pressed="false">Mokyklos</button><button type="button" data-category="shops" aria-pressed="false">Parduotuvės</button><button type="button" data-category="sports" aria-pressed="false">Sporto klubai</button></div><div class="nearby-status"><span id="nearby-status" role="status">Pasirinkite kategorijas · 2 km spinduliu</span><button id="nearby-retry" hidden type="button">Bandyti dar kartą</button></div><div id="map" role="region" aria-label="Pavyzdinės objekto vietos žemėlapis"><p class="fallback">Žemėlapis įkeliamas…</p></div><noscript><style>#map{display:none}</style><p class="fallback">Žemėlapiui įkelti įjunkite JavaScript arba naudokite nuorodą „Atidaryti žemėlapį“ objekto puslapyje.</p></noscript></body></html>
